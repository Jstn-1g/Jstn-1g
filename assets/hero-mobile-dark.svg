<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Justin Skowyra — AI systems and developer tools</title>
  <desc id="desc">Compact dark profile banner with an abstract agent network and evidence-first monogram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101e"/>
      <stop offset="0.58" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#10152d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.52" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="720" height="360" rx="24" fill="url(#background)"/>
  <rect width="720" height="360" rx="24" fill="url(#grid)"/>
  <rect width="8" height="360" rx="4" fill="url(#accent)"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <circle cx="55" cy="54" r="7" fill="#22c55e"/>
    <text x="75" y="61" fill="#9be8f7" font-size="16" font-weight="700" letter-spacing="2.2">AI SYSTEMS · DEV TOOLS</text>
    <text x="50" y="143" fill="#f8fafc" font-size="54" font-weight="780" letter-spacing="-1.8">Justin Skowyra</text>
    <text x="52" y="187" fill="#bfd0e5" font-size="22">Reliable systems. Proven work.</text>
    <rect x="52" y="220" width="360" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="52" y="273" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2">EVIDENCE FIRST</text>
    <text x="52" y="311" fill="#94a3b8" font-size="17">AI products · open source · release engineering</text>
  </g>
  <g transform="translate(548 182)">
    <circle r="89" fill="#0b1730" stroke="url(#accent)" stroke-width="3"/>
    <circle r="70" fill="#0c1a31" stroke="#67e8f9" stroke-opacity="0.32"/>
    <text x="0" y="19" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, sans-serif" font-size="62" font-weight="800">JS</text>
    <circle cx="-82" cy="-76" r="9" fill="#7c3aed"/>
    <circle cx="82" cy="-76" r="9" fill="#06b6d4"/>
    <circle cx="-82" cy="76" r="9" fill="#22c55e"/>
    <circle cx="82" cy="76" r="9" fill="#8b5cf6"/>
  </g>
  <rect x="0.75" y="0.75" width="718.5" height="358.5" rx="23.25" fill="none" stroke="#7dd3fc" stroke-opacity="0.12" stroke-width="1.5"/>
